{% extends "base.html" %}

{% block title %}{{ nationality }} — Choose Type{% endblock %}

{% block content %}
<h1>{{ nationality }} Vehicles</h1>
<p><a href="{% url 'nationality_list' %}">&larr; Back to nationalities</a></p>

<ul>
    {% for key, group in type_groups.items %}
        <li><a href="{% url 'vehicle_list' nationality=nationality type_group=key %}">{{ group.0 }}</a></li>
    {% endfor %}
</ul>
{% endblock %}
